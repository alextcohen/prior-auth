[project]
name = "prior-auth"
version = "0.1.0"
description = "Clinician review packet for prior authorization"
readme = "README.md"
authors = [{ name = "Alexander Cohen" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "pypdf>=5.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prior-auth = "prior_auth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prior_auth = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
